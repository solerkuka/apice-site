const SB=(C.SUPABASE_URL&&C.SUPABASE_ANON_KEY&&window.supabase)?window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'apice-login'}}):null;

const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const fromDb=r=>({...r,preco:r.preco?Number(r.preco):0,area:r.area?Number(r.area):0,fotos:r.fotos||[],videos:r.videos||[],criado:r.criado?new Date(r.criado).getTime():0});
const store={
 async list(){
  if(SB){const{data,error}=await SB.from('imoveis').select('*').order('criado',{ascending:false});if(error)throw error;return data.map(fromDb)}
  const own=LS.get('apice_imoveis',[]),hidden=LS.get('apice_ex_ocultos',[]),patch=LS.get('apice_ex_patch',{});
  return [...own,...SAMPLE.filter(s=>!hidden.includes(s.id)).map(s=>({...s,...(patch[s.id]||{})}))].sort((a,b)=>(b.criado||0)-(a.criado||0))},
 async save(i){
  if(SB){const d={...i};delete d.id;delete d.criado;delete d.modelo;delete d.importado;if(i.id){const{error}=await SB.from('imoveis').update(d).eq('id',i.id);if(error)throw error}else{const{error}=await SB.from('imoveis').insert(d);if(error)throw error}return}
  const own=LS.get('apice_imoveis',[]);
  if(i.id&&String(i.id).startsWith('ex')){const p=LS.get('apice_ex_patch',{});p[i.id]=i;LS.set('apice_ex_patch',p);return}
  if(i.id){const k=own.findIndex(x=>x.id===i.id);if(k>=0)own[k]=i}else{i.id='l'+Date.now();i.criado=Date.now();own.push(i)}
  if(!LS.set('apice_imoveis',own))throw new Error('Armazenamento do navegador cheio (modo demonstração). Use fotos menores.')},
 async patch(id,p){
  if(SB){const{error}=await SB.from('imoveis').update(p).eq('id',id);if(error)throw error;return}
  const all=await store.list();const i=all.find(x=>x.id===id);await store.save({...i,...p})},
 async remove(id){
  if(SB){const{error}=await SB.from('imoveis').delete().eq('id',id);if(error)throw error;return}
  if(String(id).startsWith('ex')){const h=LS.get('apice_ex_ocultos',[]);h.push(id);LS.set('apice_ex_ocultos',h);return}
  LS.set('apice_imoveis',LS.get('apice_imoveis',[]).filter(x=>x.id!==id))},
 async upload(file){
  if(SB){const ext=(file.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'');const path=new Date().getFullYear()+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
   const{error}=await SB.storage.from('midia').upload(path,file,{contentType:file.type,cacheControl:'31536000'});if(error)throw error;
   return SB.storage.from('midia').getPublicUrl(path).data.publicUrl}
  if(file.size>2.5*1024*1024)throw new Error('No modo demonstração use arquivos de até 2,5 MB.');
  return await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)})},
 async addLead(l){
  if(SB){const{error}=await SB.from('leads').insert(l);if(error)throw error;return}
  const a=LS.get('apice_leads',[]);a.push({...l,id:'c'+Date.now(),criado:Date.now()});LS.set('apice_leads',a)},
 async leads(){
  if(SB){const{data,error}=await SB.from('leads').select('*').order('criado',{ascending:false});if(error)throw error;return data.map(r=>({...r,criado:new Date(r.criado).getTime()}))}
  return LS.get('apice_leads',[]).sort((a,b)=>b.criado-a.criado)},
 async delLead(id){
  if(SB){const{error}=await SB.from('leads').delete().eq('id',id);if(error)throw error;return}
  LS.set('apice_leads',LS.get('apice_leads',[]).filter(x=>x.id!==id))}
};
const auth={
 admin:false,corretor:false,
 async init(){
  if(SB){const{data}=await SB.auth.getSession();await auth.check(data.session);SB.auth.onAuthStateChange((_e,s)=>{auth.check(s).then(()=>{if(R.name==='admin')render()})})}
  else auth.admin=LS.get('apice_demo_admin',false)},
 async check(s){
  if(!s){auth.admin=false;auth.corretor=false;return}
  const{data}=await SB.from('admins').select('email').eq('email',s.user.email).maybeSingle();auth.admin=!!data;auth.corretor=false;
  if(!auth.admin){const{data:c}=await SB.from('corretores').select('email').eq('email',s.user.email).maybeSingle();auth.corretor=!!c}},
 async login(email,pw){
  if(SB){const{error}=await SB.auth.signInWithPassword({email,password:pw});if(error)throw error;return}
  auth.admin=true;LS.set('apice_demo_admin',true)},
 async logout(){if(SB)await SB.auth.signOut();auth.admin=false;auth.corretor=false;LS.set('apice_demo_admin',false)}
};

 if(filt.tipo)l=l.filter(i=>i.tipo===filt.tipo);if(filt.cidade)l=l.filter(i=>i.cidade===filt.cidade);if(filt.suites)l=l.filter(i=>Number(i.suites||0)>=Number(filt.suites));
 if(filt.tam)l=l.filter(i=>{const m=Number(i.area||0);return filt.tam==='500'?m<=500:filt.tam==='1000'?(m>500&&m<=1000):m>1000});
 return head(c.n,c.h,c.s)+`<div class="wrap">${chipRow('Tipo','tipo',c.tipos)}${cidades.length?chipRow('Cidade','cidade',cidades):''}${k==='morar'?chipRow('Suítes (mínimo)','suites',[1,2,3,4]):''}

<p style="margin-top:22px;opacity:.7">Última atualização: outubro de 2026.</p></div></div>`+foot()}

async function sendLead(e,origem,imovel,titulo){e.preventDefault();const f=e.target,m=f.querySelector('.msg');const d=Object.fromEntries(new FormData(f));
 const l={nome:String(d.nome||'').slice(0,120),tel:String(d.tel||'').slice(0,40),tipo:String(d.tipo||'').slice(0,80),cidade:String(d.cidade||'').slice(0,80),area:String(d.area||'').slice(0,20),msg:String(d.msg||'').slice(0,1000),origem};
 if(imovel){l.imovel=imovel;l.msg='Interesse em: '+titulo}
 try{await store.addLead(l);m.className='msg';m.textContent='Recebemos! Entraremos em contato em breve.';f.reset()}catch(x){m.className='msg e';m.textContent='Não foi possível enviar agora. Tente novamente.'}return false}

 ${window.CAP?CAP.det(i):''}<div class="gal">${(i.videos||[]).map(v=>`<video controls playsinline preload="metadata" src="${ESC(v)}"></video>`).join('')}${(i.fotos||[]).map(f=>`<img loading="lazy" src="${ESC(f)}" alt="">`).join('')}</div>${i.modelo?'<p class="note">Imagem e dados de exemplo (prévia).</p>':''}
 <div class="dw"><div class="dd">${ESC(i.descricao)}</div><div><form class="box" style="margin:0" onsubmit="return sendLead(event,'interesse','${ESC(i.id)}','${ESC(i.titulo).replace(/'/g,'')}')"><b style="font-weight:400;letter-spacing:.15em;font-size:11px;text-transform:uppercase;color:#EAE3DA">Quero saber mais</b><label>Nome<input name="nome" required></label><label>WhatsApp<input name="tel" type="tel" inputmode="tel" required></label><div style="margin-top:16px;display:flex;gap:10px;flex-wrap:wrap"><p style="font-size:12px;opacity:.65;margin:0 0 12px">Ao enviar, você concorda com a <a onclick="go('privacidade')" style="text-decoration:underline;cursor:pointer">Política de Privacidade</a>.</p><button class="btn" type="submit">Enviar</button><a class="btn o" target="_blank" rel="noopener" href="${wa('Olá! Tenho interesse em: '+i.titulo)}">WhatsApp</a></div><div class="msg"></div></form></div></div></div>${foot()}`}

async function upl(inp,k){const files=[...inp.files];if(!files.length)return;let n=0;for(const fl of files){flash=`Enviando ${++n} de ${files.length}…`;const el=$('#fm');if(el)el.textContent=flash;try{form[k].push(await store.upload(fl))}catch(e){flash='!Não foi possível enviar "'+fl.name+'": '+(e.message||'tente de novo');render();return}}flash='Enviado.';render()}
function mkCover(n){const a=form.fotos;a.unshift(a.splice(n,1)[0]);render()}

/* Carrossel dos destaques: anda sozinho, pausa com o mouse em cima, e dá para arrastar (mouse) ou deslizar (dedo) para acelerar */
let mqX=0,mqRaf=0,mqAbort=null;
function initMq(){
 cancelAnimationFrame(mqRaf);if(mqAbort)mqAbort.abort();
 const mq=document.querySelector('.mq'),t=mq&&mq.querySelector('.trk');if(!t)return;
 const ac=mqAbort=new AbortController(),o={signal:ac.signal};
 const reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
 let v=0,drag=false,hover=false,moved=0,lx=0,lt=0,prev=0;
 const period=()=>{const n=t.children.length/2;return n>=1?t.children[n].offsetLeft-t.children[0].offsetLeft:0};
 mq.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag=true;moved=0;lx=e.clientX;lt=performance.now();v=0;mq.classList.add('dg')},o);
 window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,now=performance.now(),dt=Math.max(1,now-lt)/1000;moved+=Math.abs(dx);mqX-=dx;v=Math.max(-4000,Math.min(4000,.7*v+.3*(-dx/dt)));lx=e.clientX;lt=now},o);
 const up=()=>{if(!drag)return;drag=false;mq.classList.remove('dg');if(performance.now()-lt>80)v=0};
 window.addEventListener('pointerup',up,o);window.addEventListener('pointercancel',up,o);
 mq.addEventListener('click',e=>{if(moved>6){e.stopPropagation();e.preventDefault();moved=0}},{capture:true,signal:ac.signal});
 mq.addEventListener('wheel',e=>{if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){e.preventDefault();mqX+=e.deltaX}},{passive:false,signal:ac.signal});
 mq.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')hover=true},o);mq.addEventListener('pointerleave',()=>{hover=false},o);
 const tick=ts=>{const dt=Math.min(.05,(ts-(prev||ts))/1000);prev=ts;const h=period();
  if(!drag){mqX+=v*dt;v*=Math.pow(.05,dt);if(Math.abs(v)<4)v=0;if(!hover&&!reduce&&h)mqX+=h/70*dt}
  if(h>0){mqX=((mqX%h)+h)%h;t.style.transform='translate3d('+(-mqX)+'px,0,0)'}
  mqRaf=requestAnimationFrame(tick)};
 mqRaf=requestAnimationFrame(tick)}

 if(n==='admin'&&form)window.scrollTo(0,sy);if(R.goto){const g=R.goto;R.goto=null;setTimeout(()=>{const e=document.getElementById(g);if(e)e.scrollIntoView({behavior:'smooth'})},60)}initMq()}
