<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ápice Imóveis · Fale conosco no WhatsApp</title>
<meta name="description" content="Fale agora com os corretores da Ápice Imóveis pelo WhatsApp.">
<meta name="theme-color" content="#0F0E0D">
<link rel="icon" href="/assets/icone-192.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0F0E0D;color:#EAE3DA;font-family:'Montserrat',system-ui,sans-serif;font-weight:300;-webkit-text-size-adjust:100%}
main{max-width:480px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(36px + env(safe-area-inset-bottom,0px));text-align:center}
.logo{width:190px;max-width:60%;height:auto;display:block;margin:0 auto 26px}
.banner{display:block;width:100%;height:auto;margin:0 0 28px}
h1{font-weight:200;font-size:20px;letter-spacing:.14em;text-transform:uppercase;margin:0 0 8px}
p.s{font-size:14px;line-height:1.7;color:#B9AEA2;margin:0 0 26px}
.bt{display:flex;align-items:center;justify-content:space-between;gap:14px;width:100%;margin:0 0 12px;padding:18px 20px;background:#1d1a17;color:#EAE3DA;text-decoration:none;text-align:left;transition:background .2s}
.bt:hover,.bt:active{background:#2a2521}
.bt b{display:block;font-weight:400;font-size:15px;letter-spacing:.04em}
.bt small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9A8573;margin-top:4px}
.bt svg{width:26px;height:26px;flex:none;color:#25D366}
.site{display:inline-block;margin-top:22px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#D9AE7C;text-decoration:none;padding-bottom:4px;border-bottom:1px solid #6B625B}
</style>
</head>
<body>
<main>
  <img class="logo" src="/assets/logo.svg" alt="Ápice Imóveis">
  <img class="banner" id="bn" alt="" hidden>
  <h1>Fale com a gente</h1>
  <p class="s">Escolha um corretor e continue a conversa pelo WhatsApp.</p>
  <div id="lista"></div>
  <a class="site" href="/">Ver os imóveis no site</a>
</main>
<script src="/config.js"></script>
<script>
(function(){
  var C=window.APICE_CONFIG||{};
  var ICON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5.1-1.3A10 10 0 1 0 12 2zm5.2 13.9c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.4.6-.3.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.2.1.8-.1 1.4z"/></svg>';
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var num=function(n){n=String(n||'').replace(/\D/g,'');if(n.length===10||n.length===11)n='55'+n;return n};
  var msg=encodeURIComponent('Olá! Vim pelo Instagram da Ápice Imóveis.');
  var lista=(C.CORRETORES||[]).filter(function(c){return num(c.whatsapp)});
  document.getElementById('lista').innerHTML=lista.map(function(c){
    return '<a class="bt" target="_blank" rel="noopener" href="https://wa.me/'+num(c.whatsapp)+'?text='+msg+'"><span><b>'+esc(c.nome)+'</b><small>'+(c.creci?'CRECI '+esc(c.creci):'Atendimento Ápice')+'</small></span>'+ICON+'</a>';
  }).join('')||'<p class="s">Em breve.</p>';
  // Banner: coloque o arquivo na pasta whatsapp com o nome banner.jpg (ou banner.png / banner.webp)
  var nomes=['banner.jpg','banner.png','banner.webp','banner.jpeg'],i=0,bn=document.getElementById('bn');
  bn.onload=function(){bn.hidden=false};
  bn.onerror=function(){i++;if(i<nomes.length)bn.src='/whatsapp/'+nomes[i]};
  bn.src='/whatsapp/'+nomes[0];
})();
</script>
</body>
</html>
